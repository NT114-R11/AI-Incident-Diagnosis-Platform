name: Build Worker

on:
  push:
    branches:
      - main
    paths:
      - 'example-voting-app/worker/**'
      - '.github/workflows/call-docker-build-worker.yaml'
      - '.github/workflows/reusable-docker-build.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'example-voting-app/worker/**'
      - '.github/workflows/call-docker-build-worker.yaml'
      - '.github/workflows/reusable-docker-build.yaml'

jobs:
  build:
    name: Build Worker Docker Image
    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/reusable-docker-build.yaml

    with:
      context: example-voting-app/worker
      image-names: |
        ghcr.io/nt114-r11/ai-incident-diagnosis-platform-worker
        dannieltuanna/ai-incident-diagnosis-worker
      platforms: linux/amd64,linux/arm64,linux/arm/v7

    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
