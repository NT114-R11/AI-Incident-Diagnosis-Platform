# Production values for k3s deployment
# StorageClass: local-path (k3s default)

deploymentMode: Monolithic

loki:
  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 72h

  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    delete_request_store: filesystem

  rulerConfig:
    enable_api: true
    enable_alertmanager_v2: true
    alertmanager_url: http://prometheus-stack-kube-prom-alertmanager.monitoring.svc.cluster.local:9093
    evaluation_interval: 30s
    poll_interval: 30s
    rule_path: /tmp/loki/rules
    ring:
      kvstore:
        store: inmemory
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    wal:
      dir: /var/loki/ruler-wal

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

  extraVolumes:
    - name: loki-alert-rules
      configMap:
        name: loki-alert-rules
        items:
          - key: alerts.yaml
            path: fake/alerts.yaml

  extraVolumeMounts:
    - name: loki-alert-rules
      mountPath: /etc/loki/rules
      readOnly: true

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

lokiCanary:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

test:
  enabled: false

ruler:
  enabled: true
  replicas: 0
