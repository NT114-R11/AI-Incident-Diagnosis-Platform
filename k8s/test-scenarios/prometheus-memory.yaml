
apiVersion: v1
kind: Pod
metadata:
  name: diagnosis-memory-test
  namespace: voting-app
  labels:
    app: diagnosis-memory-test
    purpose: diagnosis-testing
spec:
  restartPolicy: Always
  containers:
    - name: memory-stress
      image: python:3.12-alpine
      command: ["python", "-c"]
      args:
        - |
          import time

          chunks = []

          # Allocate a fixed amount of memory: 560 MiB
          for _ in range(56):
              chunks.append(bytearray(10 * 1024 * 1024))

          print("Memory allocation completed: 560 MiB")

          # Keep allocated memory alive
          while True:
              time.sleep(10)

      resources:
        requests:
          memory: "600Mi"
        limits:
          memory: "750Mi"
