
apiVersion: v1
kind: Pod
metadata:
  name: diagnosis-loki-test
  namespace: voting-app
  labels:
    app: diagnosis-loki-test
    purpose: diagnosis-testing
spec:
  restartPolicy: Always
  containers:
    - name: nginx
      image: nginx:alpine
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date) ERROR simulated application failure: database connection failed"
            sleep 5
          done
