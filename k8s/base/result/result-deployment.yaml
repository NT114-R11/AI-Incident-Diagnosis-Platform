apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: ghcr.io/nt114-r11/ai-incident-diagnosis-platform-result:latest
        name: result
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: result
