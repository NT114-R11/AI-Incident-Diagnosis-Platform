apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voting-app

resources:
  - namespace.yaml

  # PostgreSQL
  - postgres/db-secret.yaml
  - postgres/db-pvc.yaml
  - postgres/db-deployment.yaml
  - postgres/db-service.yaml

  # Redis
  - redis/redis-deployment.yaml
  - redis/redis-service.yaml

  # Vote
  - vote/vote-deployment.yaml
  - vote/vote-service.yaml

  # Worker
  - worker/worker-deployment.yaml

  # Result
  - result/result-deployment.yaml
  - result/result-service.yaml