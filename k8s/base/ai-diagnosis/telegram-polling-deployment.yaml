apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-polling
  namespace: voting-app
  labels:
    app: telegram-polling
    app.kubernetes.io/part-of: ai-incident-diagnosis-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: telegram-polling

  template:
    metadata:
      labels:
        app: telegram-polling

    spec:
      containers:
        - name: telegram-polling

          image: ghcr.io/nt114-r11/ai-incident-diagnosis-platform-ai-diagnosis-service:latest
          imagePullPolicy: Always

          command:
            - python
            - -m 
            - scripts.telegram_polling

          envFrom:
            - configMapRef:
                name: ai-diagnosis-config

          env:
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-diagnosis-secret
                  key: GEMINI_API_KEY

            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-diagnosis-secret
                  key: TELEGRAM_BOT_TOKEN

            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-diagnosis-secret
                  key: TELEGRAM_CHAT_ID

            - name: TELEGRAM_ADMIN_IDS
              valueFrom:
                secretKeyRef:
                  name: ai-diagnosis-secret
                  key: TELEGRAM_ADMIN_IDS

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi