apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/nt114-r11/ai-incident-diagnosis-platform-vote:latest
        name: vote
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: vote
